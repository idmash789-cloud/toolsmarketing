name = "toolsmarketing-auth"
main = "src/worker.js"
compatibility_date = "2026-10-21"
workers_dev = true

# After deploying, attach Custom Domain:
# api.toolsmarketing.techo.web.id
# in Workers & Pages > toolsmarketing-auth > Settings > Domains & Routes

[vars]
SITE_ORIGIN = "https://toolsmarketing.techo.web.id"
SHEET_TAB = "Users"

# Rate limiting is approximate per Cloudflare data center.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "47160"
[ratelimits.simple]
limit = 6
period = 60

# Set these as encrypted secrets, NEVER as [vars]:
# SHEET_ID
# GOOGLE_CLIENT_EMAIL
# GOOGLE_PRIVATE_KEY
# SESSION_SECRET
# ADMIN_SETUP_TOKEN
# OWNER_EMAIL (email akun pemilik, bukan akun umum)
